<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KrizmLauncher | Multilang Cloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00d2ff;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0; font-family: 'Poppins', sans-serif;
            background: #000; color: white;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        .bg-gradient {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at top right, #1a1a2e, #000000);
        }

        /* --- AUTH SCREEN --- */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 500; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px;
        }

        .auth-box {
            width: 100%; max-width: 350px; text-align: center;
            background: var(--glass); padding: 30px; border-radius: 30px;
            border: 1px solid var(--glass-border); backdrop-filter: blur(20px);
        }

        input {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            color: white; padding: 15px; margin-bottom: 15px; border-radius: 12px; outline: none;
        }

        .btn-main {
            background: white; color: black; border: none; padding: 15px;
            border-radius: 12px; width: 100%; font-weight: 600; cursor: pointer;
        }

        .lang-switch-top {
            position: absolute; top: 20px; right: 20px;
            background: var(--glass); border: 1px solid var(--glass-border);
            color: white; padding: 8px 15px; border-radius: 10px; cursor: pointer;
        }

        /* --- LAUNCHER UI --- */
        #main-launcher { display: none; flex-direction: column; height: 100%; }
        .header { padding: 40px 20px 10px; text-align: center; }
        #clock { font-size: 3rem; font-weight: 200; margin: 0; }

        .app-container {
            flex: 1; padding: 20px; display: grid;
            grid-template-columns: repeat(4, 1fr); grid-auto-rows: 100px;
            gap: 15px; overflow-y: auto; justify-items: center;
        }

        .app-item { display: flex; flex-direction: column; align-items: center; width: 70px; position: relative; }
        .app-icon {
            width: 60px; height: 60px; background: var(--glass);
            border: 1px solid var(--glass-border); border-radius: 20px;
            display: flex; align-items: center; justify-content: center; font-size: 24px;
        }
        .app-name { font-size: 0.65rem; opacity: 0.7; margin-top: 5px; text-align: center; }

        .delete-btn {
            position: absolute; top: -5px; right: -5px; background: #ff4757;
            color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer;
        }

        .bottom-nav { padding: 20px; display: flex; justify-content: center; gap: 15px; }

        /* Modal */
        #modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000; padding: 40px;
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>
    <button class="lang-switch-top" onclick="toggleLanguage()" id="globalLangBtn">EN</button>

    <div id="auth-screen">
        <div class="auth-box" id="login-form">
            <h2 id="loginTitle">Bejelentkezés</h2>
            <input type="email" id="login-email" placeholder="E-mail">
            <input type="password" id="login-pass" placeholder="Jelszó">
            <button class="btn-main" onclick="login()" id="loginBtnTxt">Belépés</button>
            <p style="font-size: 0.8rem; margin-top: 20px;">
                <span id="noAccount">Nincs fiókod?</span> 
                <span style="color:var(--accent); cursor:pointer;" onclick="showAuth('reg')" id="regLink">Regisztráció</span>
            </p>
        </div>

        <div class="auth-box" id="reg-form" style="display: none;">
            <h2 id="regTitle">Regisztráció</h2>
            <input type="email" id="reg-email" placeholder="E-mail">
            <input type="password" id="reg-pass" placeholder="Jelszó (min. 6)">
            <button class="btn-main" onclick="register()" id="regBtnTxt">Létrehozás</button>
            <p style="font-size: 0.8rem; margin-top: 20px;">
                <span id="hasAccount">Már van fiókod?</span> 
                <span style="color:var(--accent); cursor:pointer;" onclick="showAuth('login')" id="loginLink">Belépés</span>
            </p>
        </div>
    </div>

    <div id="main-launcher">
        <div class="header">
            <div style="font-size: 0.7rem; letter-spacing: 3px; opacity: 0.5;">KRIZM CLOUD</div>
            <h1 id="clock">00:00</h1>
        </div>
        <div class="app-container" id="appGrid"></div>
        <div class="bottom-nav">
            <button class="btn-main" style="width: auto; padding: 10px 30px;" onclick="openModal()" id="addAppBtn">+ App</button>
            <button onclick="location.reload()" style="background:none; border:none; color:white; opacity:0.4;" id="logoutBtn">Kijelentkezés</button>
        </div>
    </div>

    <div id="modal">
        <h2 id="modalTitle" style="font-weight: 200;">Új parancsikon</h2>
        <input type="text" id="newAppName" placeholder="Név / Name">
        <input type="text" id="newAppUrl" placeholder="https://">
        <button class="btn-main" onclick="addApp()" id="saveBtnTxt">Mentés</button>
        <button onclick="closeModal()" style="background:none; border:none; color:white; width:100%; margin-top:20px; opacity:0.5;" id="cancelBtn">Mégse</button>
    </div>

    <script>
        let isEnglish = false;
        let currentUser = null;

        const translations = {
            hu: {
                loginT: "Bejelentkezés", loginB: "Belépés", noAcc: "Nincs fiókod?", regL: "Regisztráció",
                regT: "Regisztráció", regB: "Létrehozás", hasAcc: "Már van fiókod?", logL: "Belépés",
                addB: "+ App", logout: "Kijelentkezés", modT: "Új parancsikon", saveB: "Mentés", cancel: "Mégse",
                langB: "EN", alertPass: "Túl rövid jelszó!", alertUser: "Ez az e-mail már foglalt!", alertSucc: "Sikeres regisztráció!", alertFail: "Hibás adatok!"
            },
            en: {
                loginT: "Login", loginB: "Sign In", noAcc: "No account?", regL: "Register",
                regT: "Register", regB: "Create Account", hasAcc: "Have an account?", logL: "Login",
                addB: "+ App", logout: "Logout", modT: "New Shortcut", saveB: "Save", cancel: "Cancel",
                langB: "HU", alertPass: "Password too short!", alertUser: "Email already taken!", alertSucc: "Registration successful!", alertFail: "Invalid credentials!"
            }
        };

        function toggleLanguage() {
            isEnglish = !isEnglish;
            const lang = isEnglish ? 'en' : 'hu';
            const t = translations[lang];

            document.getElementById('loginTitle').innerText = t.loginT;
            document.getElementById('loginBtnTxt').innerText = t.loginB;
            document.getElementById('noAccount').innerText = t.noAcc;
            document.getElementById('regLink').innerText = t.regL;
            document.getElementById('regTitle').innerText = t.regT;
            document.getElementById('regBtnTxt').innerText = t.regB;
            document.getElementById('hasAccount').innerText = t.hasAcc;
            document.getElementById('loginLink').innerText = t.logL;
            document.getElementById('addAppBtn').innerText = t.addB;
            document.getElementById('logoutBtn').innerText = t.logout;
            document.getElementById('modalTitle').innerText = t.modT;
            document.getElementById('saveBtnTxt').innerText = t.saveB;
            document.getElementById('cancelBtn').innerText = t.cancel;
            document.getElementById('globalLangBtn').innerText = t.langB;
        }

        function showAuth(type) {
            document.getElementById('login-form').style.display = type === 'login' ? 'block' : 'none';
            document.getElementById('reg-form').style.display = type === 'reg' ? 'block' : 'none';
        }

        function register() {
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const t = translations[isEnglish ? 'en' : 'hu'];

            if(!email.includes('@') || pass.length < 6) return alert(t.alertPass);
            let users = JSON.parse(localStorage.getItem('krizm_users')) || {};
            if(users[email]) return alert(t.alertUser);

            users[email] = { password: pass, apps: [{name: 'YouTube', url: 'https://youtube.com', icon: 'Y'}] };
            localStorage.setItem('krizm_users', JSON.stringify(users));
            alert(t.alertSucc);
            showAuth('login');
        }

        function login() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            let users = JSON.parse(localStorage.getItem('krizm_users')) || {};
            const t = translations[isEnglish ? 'en' : 'hu'];

            if(users[email] && users[email].password === pass) {
                currentUser = email;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-launcher').style.display = 'flex';
                renderApps();
            } else {
                alert(t.alertFail);
            }
        }

        function renderApps() {
            const users = JSON.parse(localStorage.getItem('krizm_users'));
            const apps = users[currentUser].apps;
            const grid = document.getElementById('appGrid');
            grid.innerHTML = '';
            apps.forEach((app, index) => {
                grid.innerHTML += `
                    <div class="app-item">
                        <button class="delete-btn" onclick="deleteApp(${index})">×</button>
                        <a href="${app.url}" target="_blank" style="text-decoration:none; color:white; text-align:center;">
                            <div class="app-icon">${app.icon}</div>
                            <div class="app-name">${app.name}</div>
                        </a>
                    </div>
                `;
            });
        }

        function addApp() {
            const name = document.getElementById('newAppName').value;
            const url = document.getElementById('newAppUrl').value;
            if(!name || !url) return;
            let users = JSON.parse(localStorage.getItem('krizm_users'));
            users[currentUser].apps.push({ name, url, icon: name.charAt(0).toUpperCase() });
            localStorage.setItem('krizm_users', JSON.stringify(users));
            renderApps();
            closeModal();
        }

        function deleteApp(index) {
            let users = JSON.parse(localStorage.getItem('krizm_users'));
            users[currentUser].apps.splice(index, 1);
            localStorage.setItem('krizm_users', JSON.stringify(users));
            renderApps();
        }

        function openModal() { document.getElementById('modal').style.display = 'block'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = String(now.getHours()).padStart(2,'0')+":"+String(now.getMinutes()).padStart(2,'0');
        }, 1000);
    </script>
</body>
</html>
